services:
  cryptsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptsentinel-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - ML_SERVICE_URL=http://127.0.0.1:5001
      - SANDBOX_DIR=/app/monitored_sandbox
      - QUARANTINE_DIR=/app/quarantine
      - DB_PATH=/app/data/cryptsentinel.db
    volumes:
      - sentinel-data:/app/data
      - sentinel-quarantine:/app/quarantine
      - sentinel-sandbox:/app/monitored_sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
    name: cryptsentinel-data
  sentinel-quarantine:
    name: cryptsentinel-quarantine
  sentinel-sandbox:
    name: cryptsentinel-sandbox
